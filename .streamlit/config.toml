# Tema fixo CLARO: a plataforma é embarcada em páginas de fundo branco
# (iframe no portal), então não pode seguir a preferência de tema do navegador
# de quem visita — senão abre escura dentro de uma página clara.
# viz.py escolhe a paleta por st.context.theme.type, que passa a responder "light".
[theme]
base = "light"
# Identidade do GEPSA. O verde do logo (#78D854) não tem contraste como texto
# sobre branco, então a cor de ação é um verde escuro derivado dele, e o verde
# do logo fica para acentos. Vermelho continua fora da interface: na plataforma
# ele significa "com ADI". As cores dos gráficos ficam em viz._CORES.
primaryColor = "#2F7D32"
textColor = "#1E261E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDF5E6"
borderColor = "#CFE0C4"
linkColor = "#2F7D32"

[theme.sidebar]
backgroundColor = "#243226"
secondaryBackgroundColor = "#2F4032"
textColor = "#F1F6EC"
primaryColor = "#78D854"
borderColor = "#3F5442"
linkColor = "#A8E68A"

[client]
# sem menu de desenvolvimento para o visitante
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
